<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>窗簾連鎖動畫 - 照片最底層 / 卡片透明度 85%~100%</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    /* 頂部主面板：初始高度降 1/5 (26.67vh) */
    .expandable-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 26.67vh;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      transition: height 0.05s ease-out;
    }

    .curtain-track-stage {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    /* 外框容器 */
    .max-boundary-frame {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 80%;
      border: 3px solid rgba(255, 255, 240, 0.85);
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 255, 240, 0.2);
      pointer-events: none;
      z-index: 20;
      transition: all 0.2s ease;
      overflow: hidden;
    }

    /* 【最底層】照片背景層 (z-index: 0，不透明度固定為 100%) */
    .stage-bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: 1; /* 永遠為 100% 實色 */
      pointer-events: none;
    }

    /* 窗簾軌道容器 */
    .curtain-container {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 80%;
      cursor: grab;
      touch-action: none;
      z-index: 5;
    }

    /* 蓋在照片上方的動畫窗簾卡片（不透明度可調整為 85% ~ 100%） */
    .curtain-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.3);
      background-size: 20% 20%;
      background-repeat: repeat;
      background-position: center;
      background-color: #334155;
      opacity: 0.85; /* 預設 85% 不透明度 */
      will-change: transform;
      border-left: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: flex-end;
      padding: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 0.75rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      transition: transform 0.05s linear, opacity 0.1s ease;
    }

    /* 下方控制區：初始 padding-top 為 26.67vh */
    .controls-container {
      width: 100vw;
      height: 100vh;
      padding-top: 26.67vh;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 20px;
      overflow-y: auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: padding-top 0.05s ease-out;
    }

    .controls-title {
      font-size: 1rem;
      color: #38bdf8;
    }

    /* 縮圖網格 */
    .thumb-picker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .picker-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .picker-label {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .thumb-scroll-box {
      width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .thumb-scroll-box::-webkit-scrollbar {
      height: 4px;
    }
    .thumb-scroll-box::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 2px;
    }

    /* 1/3 縮圖卡片 */
    .thumb-card {
      flex: 0 0 calc((100% - 16px) / 3);
      aspect-ratio: 1 / 2;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      scroll-snap-align: start;
    }

    .thumb-card:hover {
      border-color: #64748b;
    }

    .thumb-card.active {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transform: scale(1.02);
    }

    .thumb-img {
      width: 100%;
      flex: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .thumb-name {
      height: 22px;
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    /* 控制區面板 */
    .sliders-section {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mode-switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }

    .mode-switch-group label {
      font-size: 0.85rem;
      color: #f8fafc;
      font-weight: 600;
    }

    .segmented-control {
      display: flex;
      background: #0f172a;
      padding: 3px;
      border-radius: 6px;
      gap: 4px;
    }

    .segmented-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segmented-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-item input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .val-badge {
      color: #38bdf8;
      font-size: 0.85rem;
    }

    /* 上傳照片區域 */
    .custom-upload-box {
      background: #1e293b;
      padding: 14px;
      border-radius: 8px;
      border: 1px dashed #38bdf8;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .upload-btn-label {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn-label:hover {
      background: #7dd3fc;
    }

    .upload-status-text {
      font-size: 0.75rem;
      color: #94a3b8;
      word-break: break-all;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 頂部面板 -->
  <div class="expandable-panel" id="expandablePanel">
    <div class="curtain-track-stage" id="curtainStage">
      <!-- 外框容器（最底層包含相片，上方為動畫軌道） -->
      <div class="max-boundary-frame" id="maxBoundaryFrame">
        <!-- 【最底層相片】只存在於最底層 (z-index: 0) -->
        <div class="stage-bg-layer" id="stageBgLayer"></div>
      </div>
      <div class="curtain-container" id="curtainTrack"></div>
    </div>
  </div>

  <!-- 下方控制區 -->
  <div class="controls-container" id="controlsContainer">
    <h3 class="controls-title">即時控制面板</h3>
    
    <!-- 1/3 圖片縮圖選單區 (單數層 / 雙數層) -->
    <div class="thumb-picker-grid">
      <div class="picker-group">
        <span class="picker-label">單數層 (L1, L3, L5)</span>
        <div class="thumb-scroll-box" id="oddScrollBox"></div>
      </div>
      <div class="picker-group">
        <span class="picker-label">雙數層 (L2, L4, L6)</span>
        <div class="thumb-scroll-box" id="evenScrollBox"></div>
      </div>
    </div>

    <!-- 控制區設定（滑塊與模式） -->
    <div class="sliders-section">
      <!-- 開關方式切換開關 -->
      <div class="mode-switch-group">
        <label>開劃方式：</label>
        <div class="segmented-control">
          <button class="segmented-btn active" id="btnRightSingle">右開 (單開)</button>
          <button class="segmented-btn" id="btnSplitDouble">左右對開</button>
        </div>
      </div>

      <!-- 高度滑塊 -->
      <div class="slider-item">
        <label for="heightSlider">
          <span>高度微調：</span>
          <span class="val-badge" id="heightVal">0%</span>
        </label>
        <input type="range" id="heightSlider" min="0" max="100" value="0" step="1">
      </div>

      <!-- 展開滑動滑塊 -->
      <div class="slider-item">
        <label for="widthSlider">
          <span>滑動顯示：</span>
          <span class="val-badge" id="widthVal">0%</span>
        </label>
        <input type="range" id="widthSlider" min="0" max="100" value="0" step="1">
      </div>

      <!-- 【更新】卡片不透明度滑塊 (85% ~ 100%) -->
      <div class="slider-item">
        <label for="opacitySlider">
          <span>卡片不透明度 (85% ~ 100%)：</span>
          <span class="val-badge" id="opacityVal">85%</span>
        </label>
        <input type="range" id="opacitySlider" min="85" max="100" value="85" step="1">
      </div>
    </div>

    <!-- 手機/本機相片上傳區（最底層背景相片） -->
    <div class="custom-upload-box">
      <span class="picker-label" style="color: #38bdf8;">最底層背景照片 (選取手機相片)</span>
      <label for="bgImageInput" class="upload-btn-label">📷 從手機/電腦挑選照片</label>
      <input type="file" id="bgImageInput" accept="image/*" style="display: none;">
      <span class="upload-status-text" id="uploadStatus">尚未選擇自訂照片</span>
    </div>

  </div>

  <script>
    const FILE_EXTENSION = '.jpg';

    const imageNames = [
      'P10', 'P11', 'P12', 'P13', 'P20', 'P21', 'P22', 'P23', 'P23-1', 'P24',
      'P25', 'P26', 'P30', 'P31', 'P32', 'P33', 'P34', 'p35', 'P36', 'P37',
      'P38', 'P39', 'P40', 'P41', 'P42', 'TW001', 'TW002', 'TW002-2', 'TW003', 'TW004',
      'TW005', 'TW010', 'TW011', 'TW012', 'TW013', 'TW014', 'TW015', 'TW016', 'TW017', 'TW018',
      'TW019', 'TW020', 'TW025', 'TW026', 'TW027', 'TW028', 'TW029', 'TW030', 'TW032', 'TW033',
      'TW034', 'TW035', 'TW036', 'TW037', 'TW038', 'TW039', 'TW040', 'TW041', 'TW042', 'TW043'
    ];

    const curtainTrack = document.getElementById('curtainTrack');
    const maxBoundaryFrame = document.getElementById('maxBoundaryFrame');
    const stageBgLayer = document.getElementById('stageBgLayer');
    const expandablePanel = document.getElementById('expandablePanel');
    const controlsContainer = document.getElementById('controlsContainer');
    const curtainStage = document.getElementById('curtainStage');
    
    const oddScrollBox = document.getElementById('oddScrollBox');
    const evenScrollBox = document.getElementById('evenScrollBox');
    const bgImageInput = document.getElementById('bgImageInput');
    const uploadStatus = document.getElementById('uploadStatus');

    const heightSlider = document.getElementById('heightSlider');
    const widthSlider = document.getElementById('widthSlider');
    const opacitySlider = document.getElementById('opacitySlider');
    
    const heightVal = document.getElementById('heightVal');
    const widthVal = document.getElementById('widthVal');
    const opacityVal = document.getElementById('opacityVal');

    const btnRightSingle = document.getElementById('btnRightSingle');
    const btnSplitDouble = document.getElementById('btnSplitDouble');

    let isDoubleOpen = false;
    let currentDragRatio = 0; 
    let currentCardOpacity = 0.85; // 預設 85% 卡片不透明度

    let leftPanels = [];
    let rightPanels = [];

    let selectedOddPath = `images/${imageNames[0]}${FILE_EXTENSION}`;
    let selectedEvenPath = `images/${imageNames[1] || imageNames[0]}${FILE_EXTENSION}`;

    function updatePanelImage(panel, imagePath) {
      if (!panel) return;
      const encodedPath = encodeURI(imagePath);
      panel.style.backgroundImage = `url('${encodedPath}')`;
    }

    function setStageBgImage(imageSrc) {
      if (!stageBgLayer) return;
      stageBgLayer.style.backgroundImage = `url('${imageSrc}')`;
    }

    // 上傳圖片處理 (載入至最底層照片)
    bgImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const resultDataUrl = evt.target.result;
          setStageBgImage(resultDataUrl);
          uploadStatus.innerText = `已載入背景照片：${file.name}`;
          uploadStatus.style.color = '#38bdf8';
        };
        reader.readAsDataURL(file);
      }
    });

    // 1. 動態建立卡片
    function buildCurtains() {
      curtainTrack.innerHTML = '';
      leftPanels = [];
      rightPanels = [];

      if (!isDoubleOpen) {
        for (let i = 1; i <= 6; i++) {
          const panel = document.createElement('div');
          panel.className = 'curtain-panel';
          panel.style.zIndex = i;
          panel.style.opacity = currentCardOpacity; // 套用當前卡片不透明度
          panel.innerText = `L${i}`;

          const imgPath = (i % 2 !== 0) ? selectedOddPath : selectedEvenPath;
          updatePanelImage(panel, imgPath);

          curtainTrack.appendChild(panel);
          rightPanels.push(panel);
        }
      } else {
        for (let i = 1; i <= 6; i++) {
          const panel = document.createElement('div');
          panel.className = 'curtain-panel';
          panel.style.zIndex = i;
          panel.style.opacity = currentCardOpacity;
          panel.innerText = `L${i}`;

          const imgPath = (i % 2 !== 0) ? selectedOddPath : selectedEvenPath;
          updatePanelImage(panel, imgPath);

          curtainTrack.appendChild(panel);
          leftPanels.push(panel);
        }

        for (let i = 1; i <= 6; i++) {
          const panel = document.createElement('div');
          panel.className = 'curtain-panel';
          panel.style.zIndex = i;
          panel.style.opacity = currentCardOpacity;
          panel.innerText = `L${i}`;

          const imgPath = (i % 2 !== 0) ? selectedOddPath : selectedEvenPath;
          updatePanelImage(panel, imgPath);

          curtainTrack.appendChild(panel);
          rightPanels.push(panel);
        }
      }
    }

    // 2. 通用 1/3 縮圖選擇器
    function createThumbPicker(container, isOdd, defaultSelectIndex) {
      container.innerHTML = '';

      imageNames.forEach((name, imgIdx) => {
        const filePath = `images/${name}${FILE_EXTENSION}`;
        const encodedPath = encodeURI(filePath);

        const card = document.createElement('div');
        card.className = `thumb-card ${imgIdx === defaultSelectIndex ? 'active' : ''}`;
        card.dataset.filePath = filePath;

        const imgDiv = document.createElement('div');
        imgDiv.className = 'thumb-img';
        imgDiv.style.backgroundImage = `url('${encodedPath}')`;

        const nameDiv = document.createElement('div');
        nameDiv.className = 'thumb-name';
        nameDiv.innerText = name;

        card.appendChild(imgDiv);
        card.appendChild(nameDiv);

        card.addEventListener('click', () => {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
          applySelection(container, card, isOdd, filePath);
        });

        container.appendChild(card);
      });

      let scrollTimer = null;
      container.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const cards = Array.from(container.querySelectorAll('.thumb-card'));
          const containerLeft = container.getBoundingClientRect().left;

          let closestCard = cards[0];
          let minDistance = Infinity;

          cards.forEach(card => {
            const distance = Math.abs(card.getBoundingClientRect().left - containerLeft);
            if (distance < minDistance) {
              minDistance = distance;
              closestCard = card;
            }
          });

          if (closestCard && !closestCard.classList.contains('active')) {
            applySelection(container, closestCard, isOdd, closestCard.dataset.filePath);
          }
        }, 80);
      });
    }

    function applySelection(container, activeCard, isOdd, filePath) {
      container.querySelectorAll('.thumb-card').forEach(c => c.classList.remove('active'));
      activeCard.classList.add('active');

      if (isOdd) {
        selectedOddPath = filePath;
      } else {
        selectedEvenPath = filePath;
      }

      [...rightPanels, ...leftPanels].forEach(panel => {
        const layerNum = parseInt(panel.innerText.replace('L', ''));
        if ((layerNum % 2 !== 0 && isOdd) || (layerNum % 2 === 0 && !isOdd)) {
          updatePanelImage(panel, filePath);
        }
      });
    }

    createThumbPicker(oddScrollBox, true, 0);
    createThumbPicker(evenScrollBox, false, 1);

    // 3. 計算尺寸與邊界
    function initFixedCardDimensions() {
      const stageWidth = curtainStage.clientWidth || window.innerWidth;
      const maxAllowedWidth = stageWidth * 0.88; 

      let singleCardWidth;

      if (!isDoubleOpen) {
        singleCardWidth = maxAllowedWidth / (1 + (11 / 12) * 5);
      } else {
        singleCardWidth = maxAllowedWidth / (1 + (11 / 12) * 11);
      }

      curtainTrack.style.width = `${singleCardWidth}px`;
      const hookThreshold = singleCardWidth * (11 / 12);

      if (!isDoubleOpen) {
        const maxTotalWidth = singleCardWidth + (hookThreshold * 5);
        maxBoundaryFrame.style.width = `${maxTotalWidth}px`;
        maxBoundaryFrame.style.left = 'auto';
        maxBoundaryFrame.style.right = '6vw';
        maxBoundaryFrame.style.transform = 'translateY(-50%)';

        curtainTrack.style.left = 'auto';
        curtainTrack.style.right = '6vw';
        curtainTrack.style.transform = 'translateY(-50%)';
      } else {
        const maxTotalWidth = singleCardWidth + (hookThreshold * 11);
        maxBoundaryFrame.style.width = `${maxTotalWidth}px`;
        maxBoundaryFrame.style.left = '50%';
        maxBoundaryFrame.style.right = 'auto';
        maxBoundaryFrame.style.transform = 'translate(-50%, -50%)';

        curtainTrack.style.left = '50%';
        curtainTrack.style.right = 'auto';
        curtainTrack.style.transform = 'translate(-50%, -50%)';
      }

      const borderWidth = Math.max(2, Math.round(singleCardWidth / 25));
      maxBoundaryFrame.style.borderWidth = `${borderWidth}px`;
    }

    // 4. 計算層級卡扣連動
    function updateCurtainPositions(ratio) {
      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);
      const maxDragOneSide = hookThreshold * 5;

      const currentDragDistance = ratio * maxDragOneSide;

      if (!isDoubleOpen) {
        rightPanels.forEach((panel, idx) => {
          if (idx === 0) {
            panel.style.transform = `translateX(0px)`;
            return;
          }
          const hookOffset = (5 - idx) * hookThreshold;
          const moveDist = Math.max(0, currentDragDistance - hookOffset);
          panel.style.transform = `translateX(${-moveDist}px)`;
        });
      } else {
        const centerOffset = hookThreshold * 5.5;

        leftPanels.forEach((panel, idx) => {
          const baseLeftFixed = -centerOffset;
          const hookOffset = (5 - idx) * hookThreshold;
          const moveDist = Math.max(0, currentDragDistance - hookOffset);
          panel.style.transform = `translateX(${baseLeftFixed + moveDist}px)`;
        });

        rightPanels.forEach((panel, idx) => {
          const baseRightFixed = centerOffset;
          const hookOffset = idx * hookThreshold; 
          const moveDist = Math.max(0, currentDragDistance - hookOffset);
          panel.style.transform = `translateX(${baseRightFixed - moveDist}px)`;
        });
      }
    }

    // 5. 切換單/雙開
    btnRightSingle.addEventListener('click', () => {
      isDoubleOpen = false;
      btnRightSingle.classList.add('active');
      btnSplitDouble.classList.remove('active');
      buildCurtains();
      initFixedCardDimensions();
      updateCurtainPositions(currentDragRatio);
    });

    btnSplitDouble.addEventListener('click', () => {
      isDoubleOpen = true;
      btnSplitDouble.classList.add('active');
      btnRightSingle.classList.remove('active');
      buildCurtains();
      initFixedCardDimensions();
      updateCurtainPositions(currentDragRatio);
    });

    // 6. 高度滑塊：基礎高度為 26.67vh
    heightSlider.addEventListener('input', (e) => {
      const pct = Number(e.target.value);
      heightVal.innerText = `${pct}%`;

      const minVh = 26.67, maxVh = 70; 
      const targetVh = minVh + (pct / 100) * (maxVh - minVh);

      expandablePanel.style.height = `${targetVh}vh`;
      controlsContainer.style.paddingTop = `${targetVh}vh`;

      initFixedCardDimensions();
      updateCurtainPositions(currentDragRatio);
    });

    // 7. 滑動顯示滑塊
    widthSlider.addEventListener('input', (e) => {
      const pct = Number(e.target.value);
      widthVal.innerText = `${pct}%`;

      currentDragRatio = pct / 100;
      updateCurtainPositions(currentDragRatio);
    });

    // 8. 【更新】調整「卡片」的不透明度 (85% ~ 100%)，不影響照片
    opacitySlider.addEventListener('input', (e) => {
      const pct = Number(e.target.value);
      opacityVal.innerText = `${pct}%`;

      currentCardOpacity = pct / 100;

      // 僅更新所有窗簾卡片的不透明度
      [...rightPanels, ...leftPanels].forEach(panel => {
        panel.style.opacity = currentCardOpacity;
      });
    });

    // 9. 手勢拖曳
    let isHorizontalDragging = false;
    let startX = 0;
    let startRatio = 0;

    curtainTrack.addEventListener('pointerdown', (e) => {
      isHorizontalDragging = true;
      startX = e.clientX;
      startRatio = currentDragRatio;
      curtainTrack.setPointerCapture(e.pointerId);
    });

    curtainTrack.addEventListener('pointermove', (e) => {
      if (!isHorizontalDragging) return;
      
      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);
      const maxDragOneSide = hookThreshold * 5;

      const deltaX = startX - e.clientX;
      const deltaRatio = deltaX / (maxDragOneSide || 1);

      currentDragRatio = Math.max(0, Math.min(1, startRatio + deltaRatio));
      
      const displayPct = Math.round(currentDragRatio * 100);
      widthSlider.value = displayPct;
      widthVal.innerText = `${displayPct}%`;

      updateCurtainPositions(currentDragRatio);
    });

    const stopHorizontalDrag = (e) => {
      if (!isHorizontalDragging) return;
      isHorizontalDragging = false;
      try { curtainTrack.releasePointerCapture(e.pointerId); } catch (err) {}
    };

    curtainTrack.addEventListener('pointerup', stopHorizontalDrag);
    curtainTrack.addEventListener('pointercancel', stopHorizontalDrag);

    // 視窗 resize 處理
    window.addEventListener('resize', () => {
      initFixedCardDimensions();
      updateCurtainPositions(currentDragRatio);
    });

    // 初始化執行
    buildCurtains();
    initFixedCardDimensions();
    updateCurtainPositions(0);
  </script>
</body>
</html>
