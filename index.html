<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頂部可展開式互扣窗簾動畫 (動態連動下方控制區)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    /* 頂部主面板 */
    .expandable-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 33.33vh; /* 預設 1/3 高度 */
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      transition: height 0.05s ease-out;
    }

    /* 動畫舞台 */
    .curtain-track-stage {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    /* 最大拉伸乳白色外框 */
    .max-boundary-frame {
      position: absolute;
      top: 50%;
      right: 5vw;
      transform: translateY(-50%);
      height: 80%;
      border: 3px solid rgba(255, 255, 240, 0.85);
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 255, 240, 0.2);
      pointer-events: none;
      z-index: 20;
    }

    /* 窗簾層級容器 */
    .curtain-container {
      position: absolute;
      top: 50%;
      right: 5vw; 
      transform: translateY(-50%);
      height: 80%;
      cursor: grab;
      touch-action: none;
      z-index: 5;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      box-shadow: -6px 0 15px rgba(0, 0, 0, 0.4);
      
      background-size: 20% 20%;
      background-repeat: repeat;
      background-position: center;

      will-change: transform;
      border-left: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: flex-end;
      padding: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* 下方控制區：使用 transition 配合 JavaScript 動態調整 padding-top */
    .controls-container {
      width: 100vw;
      height: 100vh;
      padding-top: 33.33vh; /* 初始避開頂部面板，後續由 JS 即時更新 */
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 20px;
      overflow-y: auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: padding-top 0.05s ease-out;
    }

    .controls-title {
      font-size: 1rem;
      color: #38bdf8;
    }

    /* 雙選單網格 */
    .select-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .control-group select {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .control-group select:focus {
      border-color: #38bdf8;
    }

    /* 滑塊樣式區 */
    .sliders-section {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-item input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .val-badge {
      color: #38bdf8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 頂部面板 -->
  <div class="expandable-panel" id="expandablePanel">
    <div class="curtain-track-stage">
      <div class="max-boundary-frame" id="maxBoundaryFrame"></div>
      <div class="curtain-container" id="curtainTrack">
        <!-- 6 層卡片 -->
      </div>
    </div>
  </div>

  <!-- 下方控制區 -->
  <div class="controls-container" id="controlsContainer">
    <h3 class="controls-title">即時控制面板</h3>
    
    <!-- 1. 圖片選擇下拉選單 -->
    <div class="select-grid">
      <div class="control-group">
        <label for="oddSelect">單數層 (1, 3, 5)</label>
        <select id="oddSelect"></select>
      </div>
      <div class="control-group">
        <label for="evenSelect">雙數層 (2, 4, 6)</label>
        <select id="evenSelect"></select>
      </div>
    </div>

    <!-- 2. 手動滑塊區 -->
    <div class="sliders-section">
      <!-- 垂直高度滑塊 -->
      <div class="slider-item">
        <label for="heightSlider">
          <span>高度 (垂直單獨拉伸):</span>
          <span class="val-badge" id="heightVal">232 cm</span>
        </label>
        <input type="range" id="heightSlider" min="232" max="292" value="232" step="1">
      </div>

      <!-- 橫向寬度滑塊 -->
      <div class="slider-item">
        <label for="widthSlider">
          <span>寬度 (橫向展開):</span>
          <span class="val-badge" id="widthVal">125 cm</span>
        </label>
        <input type="range" id="widthSlider" min="125" max="660" value="125" step="1">
      </div>
    </div>
  </div>

  <script>
    const TOTAL_LAYERS = 6;
    const FILE_EXTENSION = '.jpg';

    const imageNames = [
      'P10', 'P11', 'P12', 'P13', 'P20', 'P21', 'P22', 'P23', 'P23-1', 'P24',
      'P25', 'P26', 'P30', 'P31', 'P32', 'P33', 'P34', 'p35', 'P36', 'P37',
      'P38', 'P39', 'P40', 'P41', 'P42', 'TW001', 'TW002', 'TW002-2', 'TW003', 'TW004',
      'TW005', 'TW010', 'TW011', 'TW012', 'TW013', 'TW014', 'TW015', 'TW016', 'TW017', 'TW018',
      'TW019', 'TW020', 'TW025', 'TW026', 'TW027', 'TW028', 'TW029', 'TW030', 'TW032', 'TW033',
      'TW034', 'TW035', 'TW036', 'TW037', 'TW038', 'TW039', 'TW040', 'TW041', 'TW042', 'TW043'
    ];

    const curtainTrack = document.getElementById('curtainTrack');
    const maxBoundaryFrame = document.getElementById('maxBoundaryFrame');
    const expandablePanel = document.getElementById('expandablePanel');
    const controlsContainer = document.getElementById('controlsContainer');
    
    const oddSelect = document.getElementById('oddSelect');
    const evenSelect = document.getElementById('evenSelect');
    
    const heightSlider = document.getElementById('heightSlider');
    const widthSlider = document.getElementById('widthSlider');
    const heightVal = document.getElementById('heightVal');
    const widthVal = document.getElementById('widthVal');

    const panels = [];

    const currentImages = Array.from({ length: TOTAL_LAYERS }, (_, i) => {
      const defaultName = (i % 2 === 0) ? imageNames[0] : (imageNames[1] || imageNames[0]);
      return `images/${defaultName}${FILE_EXTENSION}`;
    });

    function updatePanelImage(panel, imagePath) {
      if (!panel) return;
      const encodedPath = encodeURI(imagePath);
      panel.style.backgroundImage = `url('${encodedPath}')`;

      panel.style.display = 'none';
      panel.offsetHeight;
      panel.style.display = 'flex';
    }

    // 1. 初始化卡片
    function initCurtains() {
      curtainTrack.innerHTML = '';
      for (let i = 0; i < TOTAL_LAYERS; i++) {
        const panel = document.createElement('div');
        panel.className = 'curtain-panel';
        panel.style.zIndex = i + 1;
        panel.innerText = `L${i + 1}`;
        
        curtainTrack.appendChild(panel);
        panels.push(panel);

        updatePanelImage(panel, currentImages[i]);
      }
    }

    // 2. 初始化下拉選單
    function initSelectors() {
      oddSelect.innerHTML = '';
      evenSelect.innerHTML = '';

      imageNames.forEach((name) => {
        const filePath = `images/${name}${FILE_EXTENSION}`;

        const optOdd = document.createElement('option');
        optOdd.value = filePath;
        optOdd.innerText = name;
        oddSelect.appendChild(optOdd);

        const optEven = document.createElement('option');
        optEven.value = filePath;
        optEven.innerText = name;
        evenSelect.appendChild(optEven);
      });

      if (imageNames.length > 1) {
        evenSelect.selectedIndex = 1;
      }

      oddSelect.addEventListener('change', (e) => {
        const path = e.target.value;
        [0, 2, 4].forEach(idx => {
          currentImages[idx] = path;
          updatePanelImage(panels[idx], path);
        });
      });

      evenSelect.addEventListener('change', (e) => {
        const path = e.target.value;
        [1, 3, 5].forEach(idx => {
          currentImages[idx] = path;
          updatePanelImage(panels[idx], path);
        });
      });
    }

    initCurtains();
    initSelectors();

    // 3. 固定卡片寬度計算
    function initFixedCardDimensions() {
      const stageHeight = curtainTrack.getBoundingClientRect().height || (window.innerHeight * 0.3333 * 0.8);
      const singleCardWidth = stageHeight / 4.5;
      
      curtainTrack.style.width = `${singleCardWidth}px`;

      const hookThreshold = singleCardWidth * (11 / 12);
      const maxTotalWidth = singleCardWidth + (hookThreshold * (TOTAL_LAYERS - 1));
      
      maxBoundaryFrame.style.width = `${maxTotalWidth}px`;

      const borderWidth = Math.max(2, Math.round(singleCardWidth / 30));
      maxBoundaryFrame.style.borderWidth = `${borderWidth}px`;
    }

    let currentDragX = 0;

    function updateCurtainPositions(dragDistance) {
      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);

      const maxDrag = hookThreshold * (TOTAL_LAYERS - 1);
      const clampedDrag = Math.max(0, Math.min(dragDistance, maxDrag));

      panels.forEach((panel, index) => {
        if (index === TOTAL_LAYERS - 1) {
          panel.style.transform = `translateX(0px)`;
          return;
        }

        const hookOffset = index * hookThreshold;
        const moveDistance = Math.max(0, clampedDrag - hookOffset);
        panel.style.transform = `translateX(${-moveDistance}px)`;
      });
    }

    // 4. 高度滑塊：同步連動下方控制區的位置
    heightSlider.addEventListener('input', (e) => {
      const cmVal = Number(e.target.value);
      heightVal.innerText = `${cmVal} cm`;

      const minCm = 232, maxCm = 292;
      const percentRatio = (cmVal - minCm) / (maxCm - minCm);
      const minVh = 30, maxVh = 70; 
      const targetVh = minVh + percentRatio * (maxVh - minVh);

      // 1) 調整頂部面板高度
      expandablePanel.style.height = `${targetVh}vh`;

      // 2) 同步將下方控制區的 padding-top 設為相同的 vh 值，讓控制區往下移
      controlsContainer.style.paddingTop = `${targetVh}vh`;

      updateCurtainPositions(currentDragX);
    });

    // 5. 寬度滑塊控制
    widthSlider.addEventListener('input', (e) => {
      const cmVal = Number(e.target.value);
      widthVal.innerText = `${cmVal} cm`;

      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);
      const maxDragDistance = hookThreshold * (TOTAL_LAYERS - 1);

      const minCm = 125, maxCm = 660;
      const ratio = (cmVal - minCm) / (maxCm - minCm);

      currentDragX = ratio * maxDragDistance;
      updateCurtainPositions(currentDragX);
    });

    // 6. 滑鼠/觸控拖曳同步
    let isHorizontalDragging = false;
    let startX = 0;
    let lastSavedDragX = 0;

    curtainTrack.addEventListener('pointerdown', (e) => {
      isHorizontalDragging = true;
      startX = e.clientX;
      curtainTrack.setPointerCapture(e.pointerId);
    });

    curtainTrack.addEventListener('pointermove', (e) => {
      if (!isHorizontalDragging) return;
      const deltaX = startX - e.clientX;
      currentDragX = lastSavedDragX + deltaX;

      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);
      const maxDragDistance = hookThreshold * (TOTAL_LAYERS - 1);

      const clampedDrag = Math.max(0, Math.min(currentDragX, maxDragDistance));
      const ratio = clampedDrag / (maxDragDistance || 1);
      
      const minCm = 125, maxCm = 660;
      const calculatedCm = Math.round(minCm + ratio * (maxCm - minCm));
      
      widthSlider.value = calculatedCm;
      widthVal.innerText = `${calculatedCm} cm`;

      updateCurtainPositions(currentDragX);
    });

    const stopHorizontalDrag = (e) => {
      if (!isHorizontalDragging) return;
      isHorizontalDragging = false;
      lastSavedDragX = currentDragX;
      try { curtainTrack.releasePointerCapture(e.pointerId); } catch (err) {}
    };

    curtainTrack.addEventListener('pointerup', stopHorizontalDrag);
    curtainTrack.addEventListener('pointercancel', stopHorizontalDrag);

    initFixedCardDimensions();
  </script>
</body>
</html>
