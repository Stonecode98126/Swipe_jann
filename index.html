<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頂部窗簾動畫 (支援雙開) + 1/3 縮圖滑動選單</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    /* 頂部主面板 */
    .expandable-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 33.33vh;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      transition: height 0.05s ease-out;
    }

    .curtain-track-stage {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    /* 外框容器 (改由 JS 控制定位) */
    .max-boundary-frame {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 80%;
      border: 3px solid rgba(255, 255, 240, 0.85);
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 255, 240, 0.2);
      pointer-events: none;
      z-index: 20;
      transition: all 0.3s ease;
    }

    /* 窗簾軌道容器 */
    .curtain-container {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 80%;
      cursor: grab;
      touch-action: none;
      z-index: 5;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      box-shadow: -6px 0 15px rgba(0, 0, 0, 0.4);
      background-size: 20% 20%;
      background-repeat: repeat;
      background-position: center;
      will-change: transform;
      border-left: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: flex-end;
      padding: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      transition: transform 0.05s linear;
    }

    /* 下方控制區 */
    .controls-container {
      width: 100vw;
      height: 100vh;
      padding-top: 33.33vh;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 20px;
      overflow-y: auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: padding-top 0.05s ease-out;
    }

    .controls-title {
      font-size: 1rem;
      color: #38bdf8;
    }

    /* 縮圖網格 */
    .thumb-picker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .picker-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .picker-label {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .thumb-scroll-box {
      width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .thumb-scroll-box::-webkit-scrollbar {
      height: 4px;
    }
    .thumb-scroll-box::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 2px;
    }

    /* 1/3 縮圖卡片 */
    .thumb-card {
      flex: 0 0 calc((100% - 16px) / 3);
      aspect-ratio: 1 / 2;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      scroll-snap-align: start;
    }

    .thumb-card:hover {
      border-color: #64748b;
    }

    .thumb-card.active {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transform: scale(1.02);
    }

    .thumb-img {
      width: 100%;
      flex: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .thumb-name {
      height: 22px;
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    /* 滑塊與模式切換區 */
    .sliders-section {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mode-switch-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }

    .mode-switch-group label {
      font-size: 0.85rem;
      color: #f8fafc;
      font-weight: 600;
    }

    .segmented-control {
      display: flex;
      background: #0f172a;
      padding: 3px;
      border-radius: 6px;
      gap: 4px;
    }

    .segmented-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segmented-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-item input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .val-badge {
      color: #38bdf8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 頂部面板 -->
  <div class="expandable-panel" id="expandablePanel">
    <div class="curtain-track-stage">
      <div class="max-boundary-frame" id="maxBoundaryFrame"></div>
      <div class="curtain-container" id="curtainTrack"></div>
    </div>
  </div>

  <!-- 下方控制區 -->
  <div class="controls-container" id="controlsContainer">
    <h3 class="controls-title">即時控制面板</h3>
    
    <!-- 1/3 圖片縮圖選單區 -->
    <div class="thumb-picker-grid">
      <div class="picker-group">
        <span class="picker-label">單數層 (1, 3, 5)</span>
        <div class="thumb-scroll-box" id="oddScrollBox"></div>
      </div>
      <div class="picker-group">
        <span class="picker-label">雙數層 (2, 4, 6)</span>
        <div class="thumb-scroll-box" id="evenScrollBox"></div>
      </div>
    </div>

    <!-- 控制區：含開關模式設定與滑塊 -->
    <div class="sliders-section">
      <!-- 開關方式切換開關 -->
      <div class="mode-switch-group">
        <label>開劃方式：</label>
        <div class="segmented-control">
          <button class="segmented-btn active" id="btnRightSingle">右開 (單開)</button>
          <button class="segmented-btn" id="btnSplitDouble">左右對開</button>
        </div>
      </div>

      <!-- 高度滑塊 -->
      <div class="slider-item">
        <label for="heightSlider">
          <span>高度 (垂直對應):</span>
          <span class="val-badge" id="heightVal">232 cm</span>
        </label>
        <input type="range" id="heightSlider" min="232" max="292" value="232" step="1">
      </div>

      <!-- 寬度滑塊 -->
      <div class="slider-item">
        <label for="widthSlider">
          <span>寬度 (橫向對應):</span>
          <span class="val-badge" id="widthVal">125 cm</span>
        </label>
        <input type="range" id="widthSlider" min="125" max="660" value="125" step="1">
      </div>
    </div>
  </div>

  <script>
    const TOTAL_LAYERS = 6;
    const FILE_EXTENSION = '.jpg';

    const imageNames = [
      'P10', 'P11', 'P12', 'P13', 'P20', 'P21', 'P22', 'P23', 'P23-1', 'P24',
      'P25', 'P26', 'P30', 'P31', 'P32', 'P33', 'P34', 'p35', 'P36', 'P37',
      'P38', 'P39', 'P40', 'P41', 'P42', 'TW001', 'TW002', 'TW002-2', 'TW003', 'TW004',
      'TW005', 'TW010', 'TW011', 'TW012', 'TW013', 'TW014', 'TW015', 'TW016', 'TW017', 'TW018',
      'TW019', 'TW020', 'TW025', 'TW026', 'TW027', 'TW028', 'TW029', 'TW030', 'TW032', 'TW033',
      'TW034', 'TW035', 'TW036', 'TW037', 'TW038', 'TW039', 'TW040', 'TW041', 'TW042', 'TW043'
    ];

    const curtainTrack = document.getElementById('curtainTrack');
    const maxBoundaryFrame = document.getElementById('maxBoundaryFrame');
    const expandablePanel = document.getElementById('expandablePanel');
    const controlsContainer = document.getElementById('controlsContainer');
    
    const oddScrollBox = document.getElementById('oddScrollBox');
    const evenScrollBox = document.getElementById('evenScrollBox');
    
    const heightSlider = document.getElementById('heightSlider');
    const widthSlider = document.getElementById('widthSlider');
    const heightVal = document.getElementById('heightVal');
    const widthVal = document.getElementById('widthVal');

    const btnRightSingle = document.getElementById('btnRightSingle');
    const btnSplitDouble = document.getElementById('btnSplitDouble');

    let isDoubleOpen = false; // 目前是否為對開模式
    let currentDragX = 0;
    const panels = [];

    const currentImages = Array.from({ length: TOTAL_LAYERS }, (_, i) => {
      const defaultName = (i % 2 === 0) ? imageNames[0] : (imageNames[1] || imageNames[0]);
      return `images/${defaultName}${FILE_EXTENSION}`;
    });

    function updatePanelImage(panel, imagePath) {
      if (!panel) return;
      const encodedPath = encodeURI(imagePath);
      panel.style.backgroundImage = `url('${encodedPath}')`;
      panel.style.display = 'none';
      panel.offsetHeight;
      panel.style.display = 'flex';
    }

    // 1. 初始化 6 層卡片
    function initCurtains() {
      curtainTrack.innerHTML = '';
      for (let i = 0; i < TOTAL_LAYERS; i++) {
        const panel = document.createElement('div');
        panel.className = 'curtain-panel';
        panel.style.zIndex = i + 1;
        panel.innerText = `L${i + 1}`;
        
        curtainTrack.appendChild(panel);
        panels.push(panel);

        updatePanelImage(panel, currentImages[i]);
      }
    }

    // 2. 生成 1/3 縮圖滑動區
    function createThumbPicker(container, targetIndices, defaultSelectIndex) {
      container.innerHTML = '';

      imageNames.forEach((name, imgIdx) => {
        const filePath = `images/${name}${FILE_EXTENSION}`;
        const encodedPath = encodeURI(filePath);

        const card = document.createElement('div');
        card.className = `thumb-card ${imgIdx === defaultSelectIndex ? 'active' : ''}`;
        card.dataset.filePath = filePath;

        const imgDiv = document.createElement('div');
        imgDiv.className = 'thumb-img';
        imgDiv.style.backgroundImage = `url('${encodedPath}')`;

        const nameDiv = document.createElement('div');
        nameDiv.className = 'thumb-name';
        nameDiv.innerText = name;

        card.appendChild(imgDiv);
        card.appendChild(nameDiv);

        card.addEventListener('click', () => {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
          applySelection(container, card, targetIndices, filePath);
        });

        container.appendChild(card);
      });

      let scrollTimer = null;
      container.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const cards = Array.from(container.querySelectorAll('.thumb-card'));
          const containerLeft = container.getBoundingClientRect().left;

          let closestCard = cards[0];
          let minDistance = Infinity;

          cards.forEach(card => {
            const distance = Math.abs(card.getBoundingClientRect().left - containerLeft);
            if (distance < minDistance) {
              minDistance = distance;
              closestCard = card;
            }
          });

          if (closestCard && !closestCard.classList.contains('active')) {
            applySelection(container, closestCard, targetIndices, closestCard.dataset.filePath);
          }
        }, 80);
      });
    }

    function applySelection(container, activeCard, targetIndices, filePath) {
      container.querySelectorAll('.thumb-card').forEach(c => c.classList.remove('active'));
      activeCard.classList.add('active');

      targetIndices.forEach(idx => {
        currentImages[idx] = filePath;
        updatePanelImage(panels[idx], filePath);
      });
    }

    initCurtains();
    createThumbPicker(oddScrollBox, [0, 2, 4], 0);
    createThumbPicker(evenScrollBox, [1, 3, 5], 1);

    // 3. 計算舞台與邊界
    function initFixedCardDimensions() {
      const stageHeight = curtainTrack.getBoundingClientRect().height || (window.innerHeight * 0.3333 * 0.8);
      const singleCardWidth = stageHeight / 4.5;
      
      curtainTrack.style.width = `${singleCardWidth}px`;

      const hookThreshold = singleCardWidth * (11 / 12);
      const maxTotalWidth = singleCardWidth + (hookThreshold * (TOTAL_LAYERS - 1));
      
      maxBoundaryFrame.style.width = `${maxTotalWidth}px`;
      
      // 更新外框與軌道位置 (對開 vs 單開)
      if (isDoubleOpen) {
        maxBoundaryFrame.style.left = '50%';
        maxBoundaryFrame.style.right = 'auto';
        maxBoundaryFrame.style.transform = 'translate(-50%, -50%)';

        curtainTrack.style.left = '50%';
        curtainTrack.style.right = 'auto';
      } else {
        maxBoundaryFrame.style.right = '5vw';
        maxBoundaryFrame.style.left = 'auto';
        maxBoundaryFrame.style.transform = 'translateY(-50%)';

        curtainTrack.style.right = '5vw';
        curtainTrack.style.left = 'auto';
      }

      const borderWidth = Math.max(2, Math.round(singleCardWidth / 30));
      maxBoundaryFrame.style.borderWidth = `${borderWidth}px`;
    }

    // 4. 更新窗簾位置（核心動畫：單開 vs 雙對開）
    function updateCurtainPositions(dragDistance) {
      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);

      if (!isDoubleOpen) {
        // === 右開模式 (原本邏輯：L6固定，向左拉) ===
        const maxDrag = hookThreshold * (TOTAL_LAYERS - 1);
        const clampedDrag = Math.max(0, Math.min(dragDistance, maxDrag));

        panels.forEach((panel, index) => {
          if (index === TOTAL_LAYERS - 1) { // L6
            panel.style.transform = `translateX(0px)`;
            return;
          }
          const hookOffset = index * hookThreshold;
          const moveDistance = Math.max(0, clampedDrag - hookOffset);
          panel.style.transform = `translateX(${-moveDistance}px)`;
        });
      } else {
        // === 左右對開模式 ===
        // 左邊群組 (L1, L2, L3)：L1 固定在最左側，L2/L3 向右移動
        // 右邊群組 (L4, L5, L6)：L6 固定在最右側，L5/L4 向左移動
        const maxHalfDrag = hookThreshold * 2; 
        const clampedDrag = Math.max(0, Math.min(dragDistance / 2, maxHalfDrag));

        panels.forEach((panel, index) => {
          if (index < 3) {
            // 左側群組: L1 (idx 0), L2 (idx 1), L3 (idx 2)
            // L1 在左邊固定，L3 向右滑出
            const leftBaseOffset = -hookThreshold * 2.5; // 水平對開置中基準
            const hookOffset = (2 - index) * hookThreshold;
            const moveDist = Math.max(0, clampedDrag - hookOffset);
            panel.style.transform = `translateX(${leftBaseOffset + moveDist}px)`;
          } else {
            // 右側群組: L4 (idx 3), L5 (idx 4), L6 (idx 5)
            // L6 在右邊固定，L4 向左滑出
            const rightBaseOffset = hookThreshold * 0.5;
            const hookOffset = (index - 3) * hookThreshold;
            const moveDist = Math.max(0, clampedDrag - hookOffset);
            panel.style.transform = `translateX(${rightBaseOffset - moveDist}px)`;
          }
        });
      }
    }

    // 5. 單雙開切換事件
    btnRightSingle.addEventListener('click', () => {
      isDoubleOpen = false;
      btnRightSingle.classList.add('active');
      btnSplitDouble.classList.remove('active');
      initFixedCardDimensions();
      updateCurtainPositions(currentDragX);
    });

    btnSplitDouble.addEventListener('click', () => {
      isDoubleOpen = true;
      btnSplitDouble.classList.add('active');
      btnRightSingle.classList.remove('active');
      initFixedCardDimensions();
      updateCurtainPositions(currentDragX);
    });

    // 6. 高度滑塊控制
    heightSlider.addEventListener('input', (e) => {
      const cmVal = Number(e.target.value);
      heightVal.innerText = `${cmVal} cm`;

      const minCm = 232, maxCm = 292;
      const percentRatio = (cmVal - minCm) / (maxCm - minCm);
      const minVh = 30, maxVh = 70; 
      const targetVh = minVh + percentRatio * (maxVh - minVh);

      expandablePanel.style.height = `${targetVh}vh`;
      controlsContainer.style.paddingTop = `${targetVh}vh`;

      updateCurtainPositions(currentDragX);
    });

    // 7. 寬度滑塊控制
    widthSlider.addEventListener('input', (e) => {
      const cmVal = Number(e.target.value);
      widthVal.innerText = `${cmVal} cm`;

      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);
      const maxDragDistance = hookThreshold * (TOTAL_LAYERS - 1);

      const minCm = 125, maxCm = 660;
      const ratio = (cmVal - minCm) / (maxCm - minCm);

      currentDragX = ratio * maxDragDistance;
      updateCurtainPositions(currentDragX);
    });

    // 8. 頂部窗簾滑動手勢
    let isHorizontalDragging = false;
    let startX = 0;
    let lastSavedDragX = 0;

    curtainTrack.addEventListener('pointerdown', (e) => {
      isHorizontalDragging = true;
      startX = e.clientX;
      curtainTrack.setPointerCapture(e.pointerId);
    });

    curtainTrack.addEventListener('pointermove', (e) => {
      if (!isHorizontalDragging) return;
      const deltaX = startX - e.clientX;
      currentDragX = lastSavedDragX + deltaX;

      const panelWidth = curtainTrack.getBoundingClientRect().width;
      const hookThreshold = panelWidth * (11 / 12);
      const maxDragDistance = hookThreshold * (TOTAL_LAYERS - 1);

      const clampedDrag = Math.max(0, Math.min(currentDragX, maxDragDistance));
      const ratio = clampedDrag / (maxDragDistance || 1);
      
      const minCm = 125, maxCm = 660;
      const calculatedCm = Math.round(minCm + ratio * (maxCm - minCm));
      
      widthSlider.value = calculatedCm;
      widthVal.innerText = `${calculatedCm} cm`;

      updateCurtainPositions(currentDragX);
    });

    const stopHorizontalDrag = (e) => {
      if (!isHorizontalDragging) return;
      isHorizontalDragging = false;
      lastSavedDragX = currentDragX;
      try { curtainTrack.releasePointerCapture(e.pointerId); } catch (err) {}
    };

    curtainTrack.addEventListener('pointerup', stopHorizontalDrag);
    curtainTrack.addEventListener('pointercancel', stopHorizontalDrag);

    initFixedCardDimensions();
    updateCurtainPositions(0);
  </script>
</body>
</html>
