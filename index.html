<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捷安片簾動畫 (60-6)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    /* 頂部可展開主面板 */
    .expandable-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 33.33vh; /* 預設 1/3 高度 */
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
      transition: height 0.1s linear;
      display: flex;
      flex-direction: column;
    }

    /* 動畫舞台 */
    .curtain-track-stage {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    /* 窗簾層級容器 */
    .curtain-container {
      position: absolute;
      top: 50%;
      right: 5vw; 
      transform: translateY(-50%);
      height: 80%;
      width: calc((33.33vh * 0.8) / 4.5); /* 1:4.5 比例 */
      cursor: grab;
      touch-action: none;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      box-shadow: -6px 0 15px rgba(0, 0, 0, 0.4);
      
      /* 關鍵設定：圖片等比例縮小為卡片尺寸的 20% (即 1/20 規模)，並重複拼貼填滿 */
      background-size: 20% 20%;
      background-repeat: repeat;
      background-position: center;

      will-change: transform;
      border-left: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: flex-end;
      padding: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 0.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* 拖拉把手 */
    .drag-handle-bar {
      height: 28px;
      width: 100%;
      background: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: ns-resize;
      touch-action: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .handle-pill {
      width: 40px;
      height: 5px;
      background-color: #94a3b8;
      border-radius: 3px;
    }

    /* 下方控制區與兩個下拉選單 */
    .controls-container {
      width: 100vw;
      height: 100vh;
      padding-top: 36vh; /* 避開頂部 1/3 面板 */
      padding-left: 16px;
      padding-right: 16px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .controls-title {
      font-size: 1rem;
      margin-bottom: 16px;
      color: #38bdf8;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .select-group select {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .select-group select:focus {
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- 頂部可展開主面板 -->
  <div class="expandable-panel" id="expandablePanel">
    <div class="curtain-track-stage">
      <div class="curtain-container" id="curtainTrack">
        <!-- 6 層卡片 -->
      </div>
    </div>

    <!-- 往下拖拉把手 -->
    <div class="drag-handle-bar" id="dragHandle">
      <div class="handle-pill"></div>
    </div>
  </div>

  <!-- 控制區 -->
  <div class="controls-container">
    <h3 class="controls-title">圖片選擇 (6 張卡片，內文圖檔縮小 1/20 填滿)</h3>
    <div class="select-grid">
      
      <!-- 單數層選單 -->
      <div class="select-group">
        <label for="oddSelect">單數層 (Layer 1, 3, 5)</label>
        <select id="oddSelect"></select>
      </div>

      <!-- 雙數層選單 -->
      <div class="select-group">
        <label for="evenSelect">雙數層 (Layer 2, 4, 6)</label>
        <select id="evenSelect"></select>
      </div>

    </div>
  </div>

  <script>
    const TOTAL_LAYERS = 6; // 保持 6 張卡片
    const FILE_EXTENSION = '.jpg'; // 若圖片副檔名為 .png 可直接改為 '.png'

    // 指定圖檔名稱清單 (61 個檔名)
    const imageNames = [
      'P10', 'P11', 'P12', 'P13', 'P20', 'P21', 'P22', 'P23', 'P23-1', 'P24',
      'P25', 'P26', 'P30', 'P31', 'P32', 'P33', 'P34', 'p35', 'P36', 'P37',
      'P38', 'P39', 'P40', 'P41', 'P42', 'TW001', 'TW002', 'TW002-2', 'TW003', 'TW004',
      'TW005', 'TW010', 'TW011', 'TW012', 'TW013', 'TW014', 'TW015', 'TW016', 'TW017', 'TW018',
      'TW019', 'TW020', 'TW025', 'TW026', 'TW027', 'TW028', 'TW029', 'TW030', 'TW032', 'TW033',
      'TW034', 'TW035', 'TW036', 'TW037', 'TW038', 'TW039', 'TW040', 'TW041', 'TW042', 'TW043'
    ];

    const curtainTrack = document.getElementById('curtainTrack');
    const expandablePanel = document.getElementById('expandablePanel');
    const dragHandle = document.getElementById('dragHandle');
    const oddSelect = document.getElementById('oddSelect');
    const evenSelect = document.getElementById('evenSelect');
    
    const panels = [];

    // 預設圖片：單數層用 P10.jpg，雙數層用 P11.jpg
    const currentImages = Array.from({ length: TOTAL_LAYERS }, (_, i) => {
      const defaultName = (i % 2 === 0) ? imageNames[0] : (imageNames[1] || imageNames[0]);
      return `images/${defaultName}${FILE_EXTENSION}`;
    });

    // 強制重繪與更新背景圖輔助函式
    function updatePanelImage(panel, imagePath) {
      if (!panel) return;
      const encodedPath = encodeURI(imagePath);
      panel.style.backgroundImage = `url('${encodedPath}')`;

      panel.style.display = 'none';
      panel.offsetHeight; // 讀取 layout 屬性觸發 reflow
      panel.style.display = 'flex';
    }

    // 1. 初始化 6 層卡片
    function initCurtains() {
      curtainTrack.innerHTML = '';
      for (let i = 0; i < TOTAL_LAYERS; i++) {
        const panel = document.createElement('div');
        panel.className = 'curtain-panel';
        panel.style.zIndex = i + 1;
        panel.innerText = `L${i + 1}`;
        
        curtainTrack.appendChild(panel);
        panels.push(panel);

        updatePanelImage(panel, currentImages[i]);
      }
    }

    // 2. 根據指定陣列生成下拉選單選項
    function initSelectors() {
      oddSelect.innerHTML = '';
      evenSelect.innerHTML = '';

      imageNames.forEach((name) => {
        const filePath = `images/${name}${FILE_EXTENSION}`;

        const optOdd = document.createElement('option');
        optOdd.value = filePath;
        optOdd.innerText = name;
        oddSelect.appendChild(optOdd);

        const optEven = document.createElement('option');
        optEven.value = filePath;
        optEven.innerText = name;
        evenSelect.appendChild(optEven);
      });

      if (imageNames.length > 1) {
        evenSelect.selectedIndex = 1;
      }

      // 監聽單數層切換 (控制 Index 0, 2, 4)
      oddSelect.addEventListener('change', (e) => {
        const path = e.target.value;
        [0, 2, 4].forEach(idx => {
          currentImages[idx] = path;
          updatePanelImage(panels[idx], path);
        });
      });

      // 監聽雙數層切換 (控制 Index 1, 3, 5)
      evenSelect.addEventListener('change', (e) => {
        const path = e.target.value;
        [1, 3, 5].forEach(idx => {
          currentImages[idx] = path;
          updatePanelImage(panels[idx], path);
        });
      });
    }

    initCurtains();
    initSelectors();

    // 3. 橫向 11/12 互扣窗簾滑動邏輯
    let isHorizontalDragging = false;
    let startX = 0;
    let currentDragX = 0;
    let lastSavedDragX = 0;

    function getPanelWidth() {
      return curtainTrack.getBoundingClientRect().width;
    }

    function syncCardWidth() {
      const stageHeight = curtainTrack.getBoundingClientRect().height;
      curtainTrack.style.width = `${stageHeight / 4.5}px`;
    }

    function updateCurtainPositions(dragDistance) {
      const panelWidth = getPanelWidth();
      const hookThreshold = panelWidth * (11 / 12); // 11/12 咬合門檻

      const maxDrag = hookThreshold * (TOTAL_LAYERS - 1);
      const clampedDrag = Math.max(0, Math.min(dragDistance, maxDrag));

      panels.forEach((panel, index) => {
        if (index === TOTAL_LAYERS - 1) {
          panel.style.transform = `translateX(0px)`;
          return;
        }

        const hookOffset = index * hookThreshold;
        const moveDistance = Math.max(0, clampedDrag - hookOffset);
        panel.style.transform = `translateX(${-moveDistance}px)`;
      });
    }

    curtainTrack.addEventListener('pointerdown', (e) => {
      isHorizontalDragging = true;
      startX = e.clientX;
      curtainTrack.setPointerCapture(e.pointerId);
    });

    curtainTrack.addEventListener('pointermove', (e) => {
      if (!isHorizontalDragging) return;
      const deltaX = startX - e.clientX;
      currentDragX = lastSavedDragX + deltaX;
      updateCurtainPositions(currentDragX);
    });

    const stopHorizontalDrag = (e) => {
      if (!isHorizontalDragging) return;
      isHorizontalDragging = false;
      lastSavedDragX = currentDragX;
      try { curtainTrack.releasePointerCapture(e.pointerId); } catch (err) {}
    };

    curtainTrack.addEventListener('pointerup', stopHorizontalDrag);
    curtainTrack.addEventListener('pointercancel', stopHorizontalDrag);

    // 4. 縱向拖拉展開/收合全螢幕邏輯
    let isVerticalDragging = false;
    let startY = 0;
    let initialPanelHeight = 0;

    dragHandle.addEventListener('pointerdown', (e) => {
      isVerticalDragging = true;
      startY = e.clientY;
      initialPanelHeight = expandablePanel.getBoundingClientRect().height;
      dragHandle.setPointerCapture(e.pointerId);
    });

    dragHandle.addEventListener('pointermove', (e) => {
      if (!isVerticalDragging) return;
      
      const deltaY = e.clientY - startY;
      let newHeight = initialPanelHeight + deltaY;

      const minHeight = window.innerHeight * 0.3333;
      const maxHeight = window.innerHeight;
      
      newHeight = Math.max(minHeight, Math.min(newHeight, maxHeight));
      
      expandablePanel.style.height = `${newHeight}px`;
      
      syncCardWidth();
      updateCurtainPositions(currentDragX);
    });

    const stopVerticalDrag = (e) => {
      if (!isVerticalDragging) return;
      isVerticalDragging = false;
      try { dragHandle.releasePointerCapture(e.pointerId); } catch (err) {}
    };

    dragHandle.addEventListener('pointerup', stopVerticalDrag);
    dragHandle.addEventListener('pointercancel', stopVerticalDrag);

    syncCardWidth();
  </script>
</body>
</html>
